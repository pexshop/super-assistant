openapi: 3.1.0
info:
  title: VPN Super API
  version: 1.0.0
  description: Read-only network and third-party service diagnostics for VPN Super Assistant.
servers:
  - url: https://YOUR-DOMAIN
paths:
  /api/health:
    get:
      summary: API health and version
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  version: { type: string }
                  status: { type: string }
                  timestamp: { type: string, format: date-time }
  /api/probe:
    get:
      summary: Probe one allowlisted external service
      parameters:
        - in: query
          name: target
          required: false
          schema:
            type: string
            enum: [cloudflare, google, ipify, ipapi, doh_cloudflare, doh_google, speed]
      responses:
        "200":
          description: Probe succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  target: { type: string }
                  latencyMs: { type: integer }
                  upstreamStatus: { type: integer }
        "400": { description: Unsupported target }
        "502": { description: Upstream failure }
  /api/diagnostics:
    get:
      summary: Run all allowlisted service checks
      responses:
        "200": { description: All checks passed }
        "207": { description: Partial check failure }

  /api/regions/start:
    post:
      summary: Create Globalping public multi-region ping measurements
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, countries]
              properties:
                target: { type: string, description: Public hostname or IPv4 address }
                countries:
                  type: array
                  maxItems: 5
                  items: { type: string, enum: [NL, US, DE, SG, JP] }
      responses:
        "200": { description: Globalping measurement IDs created }
        "401": { description: Invalid site application key }
        "503": { description: VPN_SUPER_API_KEY is not configured }
  /api/regions/results:
    get:
      summary: Retrieve Globalping measurement results
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: ids
          required: true
          schema: { type: string }
        - in: query
          name: countries
          required: true
          schema: { type: string }
      responses:
        "200": { description: Measurement status, probe metadata and RTT summaries }
        "401": { description: Invalid site application key }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
